<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <style>
      .bg { fill: #0a0e27; }
      .accent { fill: #3b82f6; }
      .text { fill: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-weight: 700; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect class="bg" width="100" height="100" rx="20"/>
  
  <!-- Blue gradient accent border -->
  <rect class="accent" width="100" height="100" rx="20" fill="none" stroke="#60a5fa" stroke-width="2" opacity="0.3"/>
  
  <!-- Stylized "Y" with marketing flair -->
  <g transform="translate(50, 50)">
    <!-- Y Letter -->
    <path class="accent" d="M -8 -15 L 0 0 L 8 -15 M 0 0 L 0 12" stroke="#3b82f6" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Marketing arrow accent -->
    <path class="accent" d="M 12 -5 L 18 -5 L 18 1" stroke="#60a5fa" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
